<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 3 JavaScript</title>
</head>

<body>

    <h1>Tugas 3 JavaScript</h1>

    <script type="text/javascript">
        let angka1 = 10;
        let angka2 = 5;

        //penjumlah
        let hasil = angka1 + angka2;
        document.write("Hasil penjumlahan: " + hasil + "<br>");

        //perkalian
        let hasilKali = angka1 * angka2;
        document.write("Hasil perkalian: " + hasilKali + "<br>");

        //pengurangan
        let hasilKurang = angka1 - angka2;
        document.write("Hasil pengurangan: " + hasilKurang + "<br>");

        //pembagian
        let hasilBagi = angka1 / angka2;
        document.write("Hasil pembagian: " + hasilBagi + "<br>");
    </script>


</body>

</html>
