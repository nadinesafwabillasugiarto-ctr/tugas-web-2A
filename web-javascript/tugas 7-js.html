<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penggunaan Fungsi dalam Javascript</title>
</head>

<body>
    <!-- Membuat Fungsi dengan Parameter -->
    <script type="text/javascript">

        //fungsi dengan parameter
        function tambah(a, b) {
            var c = a + b;
            return c
        }

        var penjumlahan = tambah(8, 10);
        document.write('hasil dari penjumlahan 8 dan 10 adalah ' + penjumlahan);
        document.write('hasil dari penjumlahan 10 dan 10000 adalah ' + penjumlahan);
    </script>
</body>

</html>
