<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator JavaScript</title>
</head>

<body>
    <h1>Kalkulator</h1>

    <script type="text/javascript">
        let angka1 = prompt("Masukkan angka pertama:");
        let angka2 = prompt("Masukkan angka kedua:");


        // menjumlahkan kedua angk
        let Penjumlahan = parseFloat(angka1) + parseFloat(angka2);

        // menampilkan hasil penjumlahan
        document.write("Hasil Penjumlahan: " + Penjumlahan + "<br>");
    </script>
</body>

</html>
