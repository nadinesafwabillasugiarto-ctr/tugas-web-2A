<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator</title>
</head>

<body>

    <h1>Kalkulator</h1>

    <script type="text/javascript">
        let angka1 = parseFloat(prompt("Masukkan angka pertama: "));
        let angka2 = parseFloat(prompt("Masukkan angka kedua: "));

        //menjumlahkan kedua angka
        let penjumlahan = parseFloat(angka1) + parseFloat(angka2);

        //menampilan hasil penjumlahan
        document.write("Hasil penjumlahan: " + penjumlahan);

    </script>


</body>

</html>
