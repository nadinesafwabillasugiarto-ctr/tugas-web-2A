<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perulangan dalam Javascript</title>
</head>

<body>
    <!-- Perulangan FOREACH -->
    <script type="text/javascript">

        document.write('<h2>Daftar Siswa</h2>');

        var siswa = ['Nadine', 'Inez', 'Titania', 'Fensa', 'Regita', 'Devana'];

        siswa.forEach(function (i) {
            document.write('<p>' + i + '</p>');
        });

    </script>
</body>

</html>
